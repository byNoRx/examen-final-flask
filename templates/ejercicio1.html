<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
</head>
<body>
<form method="post">
    <h1>Cálculo de compras</h1>

    <label for="nombre">Ingresa tu nombre</label><br>
    <input id="nombre" name="nombre" type="text" value="{{ nombre }}" required><br>

    <label for="edad">Ingresa tu edad</label><br>
    <input id="edad" name="edad" type="number" value="{{ edad }}" min="0" required><br>

    <label for="tarros">Ingresa la cantidad de tarros de pintura a comprar</label><br>
    <input id="tarros" name="tarros" type="number" value="{{ tarros }}" min="0" required><br>

    <input type="submit" value="Calcular">
</form>
<p>{{ mensaje1 }}</p>
<p>{{ mensaje2 }}</p>
<p>{{ mensaje3 }}</p>
<p>{{ mensaje4 }}</p>
</body>
</html>
